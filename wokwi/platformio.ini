[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    adafruit/RTClib
    pololu/VL53L0X
    marcoschwartz/LiquidCrystal_I2C
    adafruit/DHT sensor library

; Real hardware build with soft-AP WiFi provisioning (captive portal).
; Upload with:  pio run -e esp32dev-real -t upload
[env:esp32dev-real]
extends = env:esp32dev
build_flags =
    -D PROVISION_MODE