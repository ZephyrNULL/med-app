name: care_cube
description: "Care Cube - Smart medicine box companion app. Talks to the ESP32 via MQTT and mirrors state into Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.4
  http: ^1.2.2
  mqtt_client: ^10.7.0
  provider: ^6.1.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
