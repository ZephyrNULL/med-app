[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    tzapu/WiFiManager
    adafruit/RTClib
    pololu/VL53L0X
    marcoschwartz/LiquidCrystal_I2C
    adafruit/DHT sensor library